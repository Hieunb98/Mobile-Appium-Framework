# ==========================================
# CẤU HÌNH THÔNG SỐ MOBILE AUTOMATION
# ==========================================

# Môi trường thực thi: local / remote (giống CRM-frameWork)
TARGET=local
AUTHOR=Bat Hieu

# Nền tảng kiểm thử mặc định:
# Lựa chọn: android_emulator | android_real | ios_simulator | ios_real (hoặc android | ios)
platform=android_emulator

# Địa chỉ Appium Server
appium.url=http://127.0.0.1:4723

# ==========================================
# 1. CẤU HÌNH ANDROID EMULATOR (Máy ảo)
# ==========================================
android.emulator.udid=emulator-5554
android.emulator.deviceName=Medium_Phone_API_34
android.emulator.app=apps/mydemoapp.apk

# ==========================================
# 2. CẤU HÌNH ANDROID REAL (Máy thật)
# ==========================================
android.real.udid=RF8M1234567
android.real.deviceName=My_Real_Android
android.real.app=apps/mydemoapp.apk

# Cấu hình chung cho Android:
android.udid=emulator-5554
android.deviceName=Medium_Phone_API_34
android.app=apps/mydemoapp.apk
android.appPackage=com.saucelabs.mydemoapp.rn
android.appActivity=com.saucelabs.mydemoapp.rn.MainActivity
android.systemPort=8200
android.autoGrantPermissions=true
android.noReset=false
android.fullReset=false
android.isHeadless=false

# ==========================================
# 3. CẤU HÌNH IOS SIMULATOR (Máy ảo)
# ==========================================
ios.sim.udid=373770D0-E601-48D6-ABAD-64BAA3B7B9A7
ios.sim.deviceName=iPhone 17
ios.sim.app=apps/MyDemoApp.app

# ==========================================
# 4. CẤU HÌNH IOS REAL (Máy thật / iPad)
# ==========================================
ios.real.udid=00008101-00123456789ABCDE
ios.real.deviceName=My_Real_iPhone
ios.real.app=
ios.real.bundleId=com.saucelabs.mydemo.app.ios

# Cấu hình chung cho iOS:
ios.udid=373770D0-E601-48D6-ABAD-64BAA3B7B9A7
ios.deviceName=iPhone 17
ios.app=apps/MyDemoApp.app
ios.bundleId=com.saucelabs.mydemo.app.ios
ios.wdaLocalPort=8100
ios.isHeadless=false

# Cấu hình thời gian chờ (Seconds)
timeout.explicit=10
timeout.page.load=30
timeout.appium.command=60
timeout.device.startup=120

# Bật/tắt các tính năng bổ trợ
record.video.on.failure=true
screenshot.on.failure=true
retry.count=1
